<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | GoShopMe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Poppins:wght@600&display=swap">
<style>
  body { margin: 0; background: #f5f5f5; color: #0a0a0a; font-family: "DM Sans", sans-serif; }
  main { max-width: 390px; margin: 48px auto; background: #ffffff; border-radius: 16px; padding: 32px 24px; text-align: center; }
  img { width: 160px; height: auto; }
  h1 { font-family: Poppins, sans-serif; font-size: 22px; font-weight: 600; margin: 20px 0 8px; }
  p { font-size: 15px; line-height: 1.6; color: #444444; margin: 0; }
  button { margin-top: 20px; border: 0; border-radius: 8px; background: #939BFB; color: #ffffff; font-family: Poppins, sans-serif; font-size: 15px; font-weight: 600; padding: 12px 24px; cursor: pointer; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img src="https://goshopme-ai.github.io/Website/Logo_cropped.png" alt="GoShopMe">
  <h1 id="heading">One moment</h1>
  <p id="detail">Loading your unsubscribe link.</p>
  <button id="unsub" type="button" hidden>Unsubscribe</button>
</main>
<script>
(function () {
  var heading = document.getElementById('heading');
  var detail = document.getElementById('detail');
  var button = document.getElementById('unsub');
  var token = '';
  try { token = new URLSearchParams(window.location.search).get('token') || ''; } catch (e) {}
  var endpoint = 'https://vhxctpaysssqttbdrbec.supabase.co/functions/v1/waitlist';

  function title(text) { document.title = text + ' | GoShopMe'; }
  function invalid() {
    button.hidden = true;
    heading.textContent = 'This link is not valid';
    detail.textContent = 'This unsubscribe link does not match a waitlist signup.';
    title(heading.textContent);
  }
  function confirmed() {
    button.hidden = true;
    heading.textContent = "You're unsubscribed";
    detail.textContent = 'You will not receive GoShopMe waitlist emails.';
    title(heading.textContent);
  }
  function prompt(emailMasked) {
    heading.textContent = 'Unsubscribe';
    detail.textContent = emailMasked;
    button.hidden = false;
    title('Unsubscribe');
  }
  function post(body) {
    return fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('request failed');
      return res.json();
    });
  }

  if (!token) { invalid(); return; }
  post({ unsubscribeToken: token }).then(function (data) {
    if (!data || !data.emailMasked) { invalid(); return; }
    if (data.withdrawn) { confirmed(); return; }
    prompt(data.emailMasked);
  }).catch(function () {
    heading.textContent = 'Something went wrong';
    detail.textContent = 'Please open the unsubscribe link from your email again.';
    button.hidden = true;
  });

  button.addEventListener('click', function () {
    button.disabled = true;
    post({ unsubscribeToken: token, confirm: true }).then(function (data) {
      if (data && data.ok) confirmed();
      else invalid();
    }).catch(function () {
      button.disabled = false;
      heading.textContent = 'Something went wrong';
      detail.textContent = 'Please try the unsubscribe button again.';
    });
  });
})();
</script>
</body>
</html>
