<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | GoShopMe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Poppins:wght@600&display=swap">
<style>
  body { margin: 0; background: #f5f5f5; color: #0a0a0a; font-family: "DM Sans", sans-serif; }
  main { max-width: 390px; margin: 48px auto; background: #ffffff; border-radius: 16px; padding: 32px 24px; text-align: center; }
  img { width: 160px; height: auto; }
  h1 { font-family: Poppins, sans-serif; font-size: 22px; font-weight: 600; margin: 20px 0 8px; }
  p { font-size: 15px; line-height: 1.6; color: #444444; margin: 0; }
</style>
</head>
<body>
<main>
  <img src="https://goshopme-ai.github.io/Website/Logo_cropped.png" alt="GoShopMe">
  <h1 id="heading">One moment</h1>
  <p id="detail">Confirming your unsubscribe request.</p>
</main>
<script>
(function () {
  var heading = document.getElementById('heading');
  var detail = document.getElementById('detail');
  var token = '';
  try { token = new URLSearchParams(window.location.search).get('token') || ''; } catch (e) {}
  function show(ok) {
    heading.textContent = ok ? "You're unsubscribed" : "This link is not valid";
    detail.textContent = ok
      ? "You will not receive GoShopMe waitlist emails."
      : "This unsubscribe link does not match a waitlist signup.";
    document.title = heading.textContent + " | GoShopMe";
  }
  if (!token) { show(false); return; }
  fetch('https://vhxctpaysssqttbdrbec.supabase.co/functions/v1/waitlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ unsubscribeToken: token })
  }).then(function (res) {
    if (!res.ok) throw new Error('request failed');
    return res.json();
  }).then(function (data) {
    show(!!(data && data.ok));
  }).catch(function () {
    heading.textContent = "Something went wrong";
    detail.textContent = "Please open the unsubscribe link from your email again.";
  });
})();
</script>
</body>
</html>
